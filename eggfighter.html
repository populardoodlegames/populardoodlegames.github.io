<!DOCTYPE html>
<html><head><script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>body{margin:0;overflow:hidden;background:#000;}</style></head>
<body onload="document.documentElement.requestFullscreen()">
<script>
window.RufflePlayer=window.RufflePlayer||{};
window.addEventListener("DOMContentLoaded",()=>{
    const r=window.RufflePlayer.newest();
    const p=r.createPlayer();
    document.body.appendChild(p);
    p.load("eggfighter.swf");
    p.style.width="100vw";p.style.height="100vh";
});
</script>
<div style="position:fixed;bottom:5px;right:5px;color:#333;font-size:10px;">Classroom6x</div>
</body></html>
