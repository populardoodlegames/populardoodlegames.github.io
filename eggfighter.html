<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Fighter SWF Game</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .loader {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 255, 255, 0.1);
            border-top: 8px solid #764ba2;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            margin-bottom: 30px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .loading-subtext {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
            max-width: 300px;
        }
        
        /* Main Container */
        #main-container {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: relative;
        }
        
        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100;
            position: relative;
        }
        
        .branding {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }
        
        .brand-text h2 {
            color: white;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .brand-text p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 2px;
        }
        
        /* Game Title */
        .game-title {
            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 2px 15px rgba(0,0,0,0.4);
            letter-spacing: 1px;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0 0 20px 20px;
            width: 300px;
            margin: 0 auto;
            position: relative;
            top: -5px;
        }
        
        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .control-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .control-btn i {
            font-size: 16px;
        }
        
        /* Game Container */
        #game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .game-wrapper {
            width: 100%;
            max-width: 1200px;
            height: 100%;
            max-height: 800px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Footer */
        .footer {
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            position: relative;
            z-index: 100;
        }
        
        .footer-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        
        .footer-brand span {
            color: #667eea;
        }
        
        .instructions {
            display: flex;
            gap: 20px;
            font-size: 12px;
        }
        
        .instruction-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* Fullscreen styles */
        .fullscreen #game-container {
            padding: 0;
        }
        
        .fullscreen .game-wrapper {
            max-width: 100%;
            max-height: 100%;
            border-radius: 0;
            border: none;
        }
        
        .fullscreen .header,
        .fullscreen .footer,
        .fullscreen .game-title {
            display: none;
        }
        
        /* Watermark */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            z-index: 50;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .controls {
                width: 100%;
                justify-content: center;
            }
            
            .game-title {
                font-size: 20px;
                width: 250px;
            }
            
            .footer {
                flex-direction: column;
                gap: 10px;
                text-align: center;
                padding: 15px;
            }
            
            .instructions {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div class="loading-text">Loading Egg Fighter</div>
        <div class="loading-subtext">Powered by Ruffle Flash Emulator & Classroom6x</div>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
    </div>
    
    <!-- Main Container -->
    <div id="main-container">
        <!-- Header -->
        <div class="header">
            <div class="branding">
                <div class="logo">C6</div>
                <div class="brand-text">
                    <h2>Classroom6x.org</h2>
                    <p>Flash Game Preservation Project</p>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-btn" id="fullscreen-btn">
                    <i class="fas fa-expand"></i> Fullscreen
                </button>
                <button class="control-btn" id="reload-btn">
                    <i class="fas fa-redo"></i> Restart
                </button>
                <button class="control-btn" id="mute-btn">
                    <i class="fas fa-volume-up"></i> Sound
                </button>
            </div>
        </div>
        
        <!-- Game Title -->
        <div class="game-title">
            <i class="fas fa-gamepad"></i> Egg Fighter
        </div>
        
        <!-- Game Container -->
        <div id="game-container">
            <div class="game-wrapper">
                <!-- SWF will be loaded here by Ruffle -->
                <div id="ruffle-container"></div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="footer-brand">
                <i class="fas fa-graduation-cap"></i>
                <span>Classroom6x.org</span> | Flash Game Archive
            </div>
            <div class="instructions">
                <div class="instruction-item">
                    <i class="fas fa-mouse-pointer"></i>
                    <span>Click to Play</span>
                </div>
                <div class="instruction-item">
                    <i class="fas fa-keyboard"></i>
                    <span>Arrow Keys to Move</span>
                </div>
                <div class="instruction-item">
                    <i class="fas fa-space-shuttle"></i>
                    <span>Space to Attack</span>
                </div>
            </div>
        </div>
        
        <!-- Watermark -->
        <div class="watermark">
            Powered by Ruffle & Classroom6x
        </div>
    </div>
    
    <script>
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            const loadingScreen = document.getElementById('loading-screen');
            const mainContainer = document.getElementById('main-container');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const reloadBtn = document.getElementById('reload-btn');
            const muteBtn = document.getElementById('mute-btn');
            let isFullscreen = false;
            
            // Simulate 3 second loading
            setTimeout(() => {
                // Fade out loading screen
                loadingScreen.style.opacity = '0';
                
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    mainContainer.style.display = 'flex';
                    
                    // Initialize Ruffle
                    loadSWF();
                }, 500);
            }, 3000); // 3 seconds loading
            
            // Fullscreen functionality
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            
            // Reload functionality
            reloadBtn.addEventListener('click', function() {
                if (confirm('Restart the game?')) {
                    location.reload();
                }
            });
            
            // Mute functionality
            muteBtn.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (icon.classList.contains('fa-volume-up')) {
                    icon.classList.remove('fa-volume-up');
                    icon.classList.add('fa-volume-mute');
                    this.innerHTML = '<i class="fas fa-volume-mute"></i> Muted';
                    // Note: Ruffle volume control would need specific API calls
                } else {
                    icon.classList.remove('fa-volume-mute');
                    icon.classList.add('fa-volume-up');
                    this.innerHTML = '<i class="fas fa-volume-up"></i> Sound';
                }
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                // F11 for fullscreen
                if (e.key === 'F11') {
                    e.preventDefault();
                    toggleFullscreen();
                }
                
                // F5 for reload
                if (e.key === 'F5') {
                    e.preventDefault();
                    location.reload();
                }
                
                // Escape to exit fullscreen
                if (e.key === 'Escape' && isFullscreen) {
                    exitFullscreen();
                }
            });
            
            // Fullscreen functions
            function toggleFullscreen() {
                if (!isFullscreen) {
                    enterFullscreen();
                } else {
                    exitFullscreen();
                }
            }
            
            function enterFullscreen() {
                const elem = document.documentElement;
                
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
                
                document.body.classList.add('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i> Exit Fullscreen';
                isFullscreen = true;
            }
            
            function exitFullscreen() {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                
                document.body.classList.remove('fullscreen');
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
                isFullscreen = false;
            }
            
            // Fullscreen change events
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.addEventListener('mozfullscreenchange', handleFullscreenChange);
            document.addEventListener('MSFullscreenChange', handleFullscreenChange);
            
            function handleFullscreenChange() {
                isFullscreen = !!(document.fullscreenElement || 
                                 document.webkitFullscreenElement || 
                                 document.mozFullScreenElement || 
                                 document.msFullscreenElement);
                
                if (!isFullscreen) {
                    document.body.classList.remove('fullscreen');
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
                }
            }
            
            // Load SWF with Ruffle
            function loadSWF() {
                window.RufflePlayer = window.RufflePlayer || {};
                
                window.addEventListener("DOMContentLoaded", () => {
                    const ruffle = window.RufflePlayer.newest();
                    const player = ruffle.createPlayer();
                    const container = document.getElementById("ruffle-container");
                    container.appendChild(player);
                    
                    // Load your SWF file
                    player.load("eggfighter.swf");
                    
                    // Additional Ruffle configuration
                    player.style.width = "100%";
                    player.style.height = "100%";
                });
            }
            
            // Add progress bar animation
            const progressBar = document.querySelector('.progress-bar');
            if (progressBar) {
                const progress = document.createElement('div');
                progress.className = 'progress';
                progressBar.appendChild(progress);
                
                let width = 0;
                const interval = setInterval(() => {
                    if (width >= 100) {
                        clearInterval(interval);
                    } else {
                        width += 1;
                        progress.style.width = width + '%';
                        progress.style.height = '100%';
                        progress.style.background = 'linear-gradient(90deg, #667eea, #764ba2)';
                        progress.style.borderRadius = '10px';
                        progress.style.transition = 'width 0.1s ease';
                    }
                }, 30);
                
                progressBar.style.width = '300px';
                progressBar.style.height = '8px';
                progressBar.style.background = 'rgba(255, 255, 255, 0.1)';
                progressBar.style.borderRadius = '10px';
                progressBar.style.marginTop = '20px';
                progressBar.style.overflow = 'hidden';
            }
        });
    </script>
</body>
</html>
